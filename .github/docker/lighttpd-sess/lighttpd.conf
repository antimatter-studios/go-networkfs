# WebDAV over /srv/dav, every path behind HTTP Digest auth for one account.
# See the Dockerfile for why this server exists and what md5-sess.lua does.
server.document-root = "/srv/dav"
server.port          = 8080
server.errorlog      = "/dev/stderr"
# mod_magnet FIRST: lighttpd runs a hook in module order, and md5-sess.lua has
# to see a request before mod_auth checks it.
server.modules      += ( "mod_magnet", "mod_auth", "mod_authn_file", "mod_webdav" )

auth.backend                   = "htdigest"
auth.backend.htdigest.userfile = "/var/lib/lighttpd-dav/htdigest"
auth.require = ( "/" => (
    "method"    => "digest",
    "realm"     => "webdav-md5-sess",
    "algorithm" => "MD5",
    "require"   => "valid-user",
) )

webdav.activate    = "enable"
webdav.is-readonly = "disable"

magnet.attract-raw-url-to        = ( "/etc/lighttpd/md5-sess.lua" )
magnet.attract-response-start-to = ( "/etc/lighttpd/md5-sess.lua" )
