# WebDAV over /srv/dav, every path behind HTTP Digest auth for one account.
# See the Dockerfile for why this server exists and what each listener offers.
server.document-root = "/srv/dav"
server.port          = 8080
server.errorlog      = "/dev/stderr"
server.modules      += ( "mod_auth", "mod_authn_file", "mod_webdav" )

auth.backend                = "plain"
auth.backend.plain.userfile = "/var/lib/lighttpd-dav/passwords"
auth.require = ( "/" => (
    "method"    => "digest",
    "realm"     => "webdav-sha256",
    "algorithm" => "SHA-256",
    "require"   => "valid-user",
) )

$SERVER["socket"] == ":8081" {
    auth.require = ( "/" => (
        "method"    => "digest",
        "realm"     => "webdav-sha256",
        "algorithm" => "SHA-256|MD5",
        "require"   => "valid-user",
    ) )
}

webdav.activate    = "enable"
webdav.is-readonly = "disable"
