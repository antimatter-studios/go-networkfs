# A forward proxy for the test network and nothing else: every request is
# allowed and none is cached, so each one reaches the server behind it. It runs
# in the foreground (-N) with its logs on the container's stdout and stderr.
http_port 3128
http_access allow all
cache deny all
# The Via header names this proxy, so a test can tell an answer came through it.
visible_hostname go-networkfs-squid
access_log stdio:/dev/stdout
cache_log stdio:/dev/stderr
pid_filename none
logfile_rotate 0
shutdown_lifetime 0 seconds
