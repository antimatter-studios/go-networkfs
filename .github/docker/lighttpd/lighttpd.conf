# mod_webdav over /srv/dav, behind HTTP Basic auth for one account. The driver
# sends credentials, and a server that ignored them would let a broken
# credential path pass.
server.modules = ("mod_auth", "mod_authn_file", "mod_webdav")
server.document-root = "/srv/dav"
server.port = 80
server.username = "lighttpd"
server.groupname = "lighttpd"
server.upload-dirs = ("/tmp")

webdav.activate = "enable"
webdav.is-readonly = "disable"
webdav.sqlite-db-name = "/var/lib/lighttpd-dav/webdav.db"

auth.backend = "plain"
auth.backend.plain.userfile = "/var/lib/lighttpd-dav/users"
auth.require = ("/" => ("method" => "basic", "realm" => "webdav", "require" => "valid-user"))

# lighttpd caches stat() results by default, so a PROPFIND straight after a
# write can report the previous modification time and entity tag. A revision
# read from a cache is not the server's current revision, so the cache is off.
server.stat-cache-engine = "disable"
