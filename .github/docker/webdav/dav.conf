# mod_dav over the document root, behind HTTP Basic auth for one account. The
# driver sends credentials, and a server that ignored them would let a broken
# credential path pass.
LoadModule dav_module modules/mod_dav.so
LoadModule dav_fs_module modules/mod_dav_fs.so
LoadModule dav_lock_module modules/mod_dav_lock.so
LoadModule auth_digest_module modules/mod_auth_digest.so

ServerName webdav
DavLockDB /usr/local/apache2/var/DavLock

<Directory "/usr/local/apache2/htdocs">
    Dav On
    # DirectorySlash is left at its default, On: mod_dir answers a collection
    # named without its trailing slash with a 301 to the slash-terminated URL,
    # as a stock server does, and the driver has to cope with it (#83).
    Options None
    AllowOverride None
    AuthType Basic
    AuthName "webdav"
    AuthUserFile /usr/local/apache2/var/htpasswd
    Require valid-user
</Directory>

# The same account behind HTTP Digest auth, on port 81 (#95). A digest response
# covers the request URI, so a request the driver re-sends to a collection's
# slash-terminated URL needs credentials computed for that URL; Basic
# credentials, above, would hide a request that carried the first URL's.
# DirectorySlash is at its default here too.
#
# A port of its own rather than a path under port 80: the driver checks a
# mount by asking the server's root, and the scheme gowebdav settles on there
# is the one it uses for every request after.
Listen 81
<VirtualHost *:81>
    DocumentRoot "/usr/local/apache2/digest"
    <Directory "/usr/local/apache2/digest">
        Dav On
        Options None
        AllowOverride None
        AuthType Digest
        AuthName "webdav-digest"
        AuthDigestProvider file
        AuthUserFile /usr/local/apache2/var/htdigest
        Require valid-user
    </Directory>
</VirtualHost>
