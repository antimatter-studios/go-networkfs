# mod_dav over the document root, behind HTTP Basic auth for one account. The
# driver sends credentials, and a server that ignored them would let a broken
# credential path pass.
LoadModule dav_module modules/mod_dav.so
LoadModule dav_fs_module modules/mod_dav_fs.so
LoadModule dav_lock_module modules/mod_dav_lock.so

ServerName webdav
DavLockDB /usr/local/apache2/var/DavLock

<Directory "/usr/local/apache2/htdocs">
    Dav On
    # mod_dir would otherwise answer a collection named without its trailing
    # slash with a 301, which Go's HTTP client follows as a GET, so PROPFIND
    # and DELETE of "/dir" fail. The driver does not yet handle that redirect
    # (#83); this fixture tests conditional mutations, not it.
    DirectorySlash Off
    Options None
    AllowOverride None
    AuthType Basic
    AuthName "webdav"
    AuthUserFile /usr/local/apache2/var/htpasswd
    Require valid-user
</Directory>
