name: CI

# EVERY JOB RUNS CHORE TASKS. There is no `make` here and no raw `go` command:
# what this workflow runs is what a contributor runs, so "green locally" and
# "green in CI" are the same evidence (issue #8, and the test contract at the
# top of chores.yml).
#
#   test (os)                 `chore deps:verify`, `chore vet`, `chore test:native`
#                             — the suite with the race detector on both
#                             platforms. No servers: cgo, the SMB client and the
#                             TUI differ on Darwin, and that is what two jobs buy.
#   integration (containerised) `chore test` — every server, every driver's tagged
#                             integration tests and the C ABI harnesses, all
#                             inside containers. This is the job whose coverage
#                             number means anything.
#   lint                      `chore lint` — gofmt -s and the pinned golangci-lint.
#   govulncheck               `chore vulncheck` — through the accepted-findings
#                             gate, not a bare `govulncheck ./...`.
#   c-archive builds (os)     `chore archives:host`, `chore tui` — that the
#                             c-archive path still links on each platform.
#   ci-ok                     the one required check: `if: always()`, it needs
#                             every job above and fails unless each concluded
#                             `success`.
#
# ONLY `ci-ok` IS REQUIRED, so the jobs behind it can be renamed, split or
# given a new matrix leg without leaving a required check that never reports.
# What keeps that true is rust-fs-core's ci-gate, run by `chore lint`: it fails
# if a job here is missing from `ci-ok`'s `needs:`, if `ci-ok` loses
# `if: always()`, or if `.github-guard` names anything but `ci-ok`.
#
# THE TIERS NEED A SIBLING. ../rust-fs-core/scripts/tier.sh runs the suite through
# rust-fs-core's ../rust-fs-core/scripts/output-budget.sh, which is NOT committed here: a
# copy that nothing compares is a copy that drifts, and this family had three
# of them. `chore siblings` clones the pinned ref (chores.yml's FS_CORE_REF)
# beside the checkout, so every job that runs a tier calls it first and no job
# that does not runs it at all. It is one `git fetch` of a small public
# repository; there is no token and no cross-org secret in it.
#
# THE OUTPUT BUDGET IS IN THE TASKS, so it is in this workflow too. Each tier
# writes its full output to tmp/logs/<tier>.log and prints a verdict; a tier
# that prints more than its measured budget FAILS with status 65, which is how
# a job that starts emitting thousands of lines turns red here rather than
# being noticed by whoever scrolls it next. The logs are uploaded, so nothing
# is lost by the terminal being quiet.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # One pin for every job. chore is how this repository is driven, so it is
  # installed before anything else and checked against the release checksums.
  CHORE_VERSION: "0.11.0"

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: install chore
        run: scripts/ci-install-chore.sh

      - name: chore deps:verify
        run: chore deps:verify

      - name: chore vet
        run: chore vet

      # The pinned rust-fs-core beside this checkout: `chore test:native` and
      # `chore test:scripts` both run rust-fs-core's tier.sh in place from it.
      - name: chore siblings
        run: chore siblings

      # BOTH platforms, because the guards are shell, where the platforms
      # differ: macOS runners ship bash 3.2. A guard that only ever ran on ubuntu would be a guard that
      # had never met half the machines this repository is developed on.
      - name: chore test:scripts
        run: chore test:scripts

      # Quiet: one verdict line naming tmp/logs/native.log, which is uploaded
      # below. A failure names that log, which is in the artifact.
      - name: chore test:native
        run: chore test:native

      # BOTH platforms, because the log is where the detail went. A tier that
      # breaches its output budget says how big it was and nothing about what
      # was in it, so the run that has to be diagnosed is exactly the one whose
      # log must be here — and the platform that prints more is the one that
      # was not uploading anything.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-${{ matrix.os }}
          path: |
            coverage.out
            tmp/logs/

  integration:
    name: integration (containerised)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Everything runs inside containers: six servers for the drivers that
      # need one, and a runner carrying the Go toolchain, a C compiler and
      # chore. No toolchain is installed on this runner, so what CI executes is
      # what a contributor executes with `chore test`.
      #
      # The S3 server (stupid-simple-s3) is the one that also runs natively —
      # `chore test:s3` fetches its pinned binary and needs no daemon. It stays
      # a container here so it can join the shared network and be reached by
      # name, the same as the other five. Every image is pinned.
      - name: install chore
        run: scripts/ci-install-chore.sh

      # Bind-mounted into the container by scripts/docker-suite.sh at
      # /rust-fs-core, which is ../rust-fs-core from the checkout at /src.
      - name: chore siblings
        run: chore siblings

      - name: chore test
        run: chore test

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-coverage
          path: |
            coverage.out
            tmp/logs/

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: install chore
        run: scripts/ci-install-chore.sh

      # The pinned golangci-lint, fetched as the release binary — the same one
      # golangci/golangci-lint-action used to install, now installed by a task
      # so `chore lint` locally is this job.
      - name: chore tools
        run: chore tools

      # `chore lint` runs rust-fs-core's ci-gate and family-check in place,
      # so it needs the pinned sibling like the tiers do.
      - name: chore siblings
        run: chore siblings

      - name: chore lint
        run: chore lint

  vulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: install chore
        run: scripts/ci-install-chore.sh

      - name: chore tools
        run: chore tools

      # Not `govulncheck ./...` directly: the gate fails on anything this
      # project calls that has not been consciously accepted, and the accepted
      # list carries the reason each one is there. A check that is permanently
      # red because of one unfixable finding reports nothing at all.
      - name: chore vulncheck
        run: chore vulncheck

  build-archives:
    name: c-archive builds (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: install chore
        run: scripts/ci-install-chore.sh

      # `archives:host`, not `archives`: the shipping task cross-builds for
      # darwin because its consumer is a macOS app, and what this job is for is
      # that the c-archive path still links on the machine it is running on.
      # One task, nine archives — the nine `go build` steps this replaced could
      # drift from the driver list and did not check it.
      - name: chore archives:host
        run: chore archives:host

      - name: chore tui
        run: chore tui

  ci-ok:
    name: ci-ok
    # THE ONE REQUIRED CHECK (#43). `.github-guard` named the seven check-runs
    # by hand, so a job added here gated nothing and a job renamed here left a
    # required check that never reports, which blocks every merge with nothing
    # red to point at. It runs no work of its own: it is a claim about the
    # other jobs, judged from `needs` as a whole, so a job added to `needs:`
    # is judged without editing this step.
    if: always()
    needs: [test, integration, lint, vulncheck, build-archives]
    runs-on: ubuntu-latest
    steps:
      - name: every gating job must have concluded success
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          bad="$(echo "$NEEDS" | jq -r '[to_entries[] | select(.value.result != "success") | .key] | join(", ")')"
          if [ -n "$bad" ]; then
            echo "::error::not 'success': $bad -- failure, cancellation and skipping all mean the gate did not run to completion"
            exit 1
          fi
          echo "all gating jobs succeeded"
