name: CI

# EVERY JOB RUNS CHORE TASKS. There is no `make` here and no raw `go` command:
# what this workflow runs is what a contributor runs, so "green locally" and
# "green in CI" are the same evidence (issue #8, and the test contract at the
# top of chores.yml).
#
#   test (os)                 `chore deps:verify`, `chore vet`, `chore test:native`
#                             — the suite with the race detector on both
#                             platforms. No servers: cgo, the SMB client and the
#                             TUI differ on Darwin, and that is what two jobs buy.
#   integration (containerised) `chore test` — every server, every driver's tagged
#                             integration tests and the C ABI harnesses, all
#                             inside containers. This is the job whose coverage
#                             number means anything.
#   lint                      `chore lint` — gofmt -s and the pinned golangci-lint.
#   govulncheck               `chore vulncheck` — through the accepted-findings
#                             gate, not a bare `govulncheck ./...`.
#   c-archive builds (os)     `chore archives:host`, `chore tui` — that the
#                             c-archive path still links on each platform.
#   ci-ok                     the one required check: `if: always()`, it needs
#                             every job above and fails unless each concluded
#                             `success`.
#
# ONLY `ci-ok` IS REQUIRED, so the jobs behind it can be renamed, split or
# given a new matrix leg without leaving a required check that never reports.
# What keeps that true is rust-fs-core's ci-gate, run by `chore lint`: it fails
# if a job here is missing from `ci-ok`'s `needs:`, if `ci-ok` loses
# `if: always()`, or if `.github-guard` names anything but `ci-ok`.
#
# THE TIERS NEED A SIBLING. ../rust-fs-core/scripts/tier.sh runs the suite through
# rust-fs-core's ../rust-fs-core/scripts/output-budget.sh, which is NOT committed here: a
# copy that nothing compares is a copy that drifts, and this family had three
# of them. `chore siblings` clones the pinned ref (chores.yml's FS_CORE_REF)
# beside the checkout, so every job that runs a tier calls it first and no job
# that does not runs it at all. It is one `git fetch` of a small public
# repository; there is no token and no cross-org secret in it.
#
# THE OUTPUT BUDGET IS IN THE TASKS, so it is in this workflow too. Each tier
# writes its full output to tmp/logs/<tier>.log and prints a verdict; a tier
# that prints more than its measured budget FAILS with status 65, which is how
# a job that starts emitting thousands of lines turns red here rather than
# being noticed by whoever scrolls it next. The logs are uploaded, so nothing
# is lost by the terminal being quiet.

on:
  push:
    branches: [main]
  pull_request:
  # The merge queue's run: main plus the queued pull requests, the run that
  # decides whether they land. The queue reads ci-ok only from a workflow
  # that triggers here.
  merge_group:

permissions:
  contents: read

env:
  # One pin for every job. chore is how this repository is driven, so it is
  # installed before anything else and checked against the release checksums.
  CHORE_VERSION: "0.11.0"

jobs:
  # Does this change need the full pipeline? rust-fs-core's
  # scripts/code-changed.sh reads the change's paths and says false only when
  # every one is documentation. The change is the pull request's diff, the
  # merge queue group's (its base_sha to its head_sha: what the queue is about
  # to land), or a push to main's (before to after); a tag or a push it cannot
  # diff runs everything. The ubuntu and macOS tests, the integration tests
  # and the release archives run only when the answer is true, and ci-ok
  # accepts their skip when, and only when, it is false.
  #
  changes-gate:
    runs-on: antimatter-vps-gate
    timeout-minutes: 1
    outputs: { runner: "${{ steps.pick.outputs.runner }}" }
    steps: [{ id: pick, run: runner-gate pick linux-x64 }]

  changes:
    name: changes (does this need the full pipeline?)
    needs: changes-gate
    runs-on: ${{ needs.changes-gate.outputs.runner }}
    timeout-minutes: 5
    outputs:
      code: ${{ steps.c.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install chore
        run: scripts/ci-install-chore.sh
      - name: chore siblings
        run: chore siblings
      - name: Classify the change
        id: c
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          MQ_BASE: ${{ github.event.merge_group.base_sha }}
          MQ_HEAD: ${{ github.event.merge_group.head_sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
        run: |
          set -euo pipefail
          range=
          case "$EVENT" in
            pull_request) range="$PR_BASE...$PR_HEAD" ;;
            merge_group) range="$MQ_BASE...$MQ_HEAD" ;;
            push)
              case "$REF" in
                refs/heads/*)
                  if [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != 0000000000000000000000000000000000000000 ] &&
                    git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
                    range="$PUSH_BEFORE...$PUSH_AFTER"
                  fi ;;
              esac ;;
          esac
          if [ -n "$range" ]; then
            git diff --name-only "$range" | tee changed.txt
            code="$(bash ../rust-fs-core/scripts/code-changed.sh < changed.txt)"
          else
            code=true
          fi
          echo "code=$code ($EVENT${range:+ $range})"
          echo "code=$code" >> "$GITHUB_OUTPUT"

  # EVERY JOB TAKES ITS RUNNER FROM ITS OWN GATE JOB. Each job here has a
  # `<job>-gate` just before it, with the same `needs` and the same `if:`. The
  # gate runs on `antimatter-vps-gate`, the gate's own runner, and answers with
  # a label for the job's class: an antimatter-vps runner while one is free,
  # otherwise GitHub's. The job reads only its own gate's answer. Fork pull
  # requests always get GitHub's runner, and the gate never fails a job.
  #
  # The gate replaced `runner-*` pick jobs that ran on GitHub's ubuntu-24.04
  # for a few seconds of curl. With the organisation's hosted runners
  # saturated, each of those waited 368-2539 s for a runner before it asked
  # anything (#133). A gate job takes no hosted runner at all.
  #
  # ONE JOB PER PLATFORM, NOT A MATRIX OVER `os`. A gate answers one class,
  # so `test` and `build-archives` are a Linux job and a macOS job, each with
  # its own gate. The check names stay `test (<os>)` and
  # `c-archive builds (<os>)`.
  #
  # NO macOS IN A MERGE GROUP (#120): a macOS job there waited 15-19 minutes
  # for a runner that never came, was cancelled with zero steps, and the queue
  # dropped the pull request. Darwin is proven on the pull request head before
  # it is queued, so the macOS jobs and their gates are skipped for a merge
  # group, and `ci-ok` accepts that skip there and nowhere else.
  #
  # scripts/tests/runner-gate-jobs.sh holds every job to this shape, and
  # scripts/tests/merge-group-macos-legs.sh holds the merge-group rule.
  test-linux-gate:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: antimatter-vps-gate
    timeout-minutes: 1
    outputs: { runner: "${{ steps.pick.outputs.runner }}" }
    steps: [{ id: pick, run: runner-gate pick linux-x64 }]

  test-linux:
    name: test (ubuntu-latest)
    needs: [changes, test-linux-gate]
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ needs.test-linux-gate.outputs.runner }}
    # 8, not 5: this job can be placed on antimatter-vps, where a cold Go
    # toolchain and module cache cost about five times what GitHub's warm image
    # costs (303s against 91s, run 44308179842). The budget covers the slower
    # runner, because that is the one it may get.
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      # The antimatter-vps image is not GitHub's: cgo needs a C compiler.
      - name: C toolchain for the gated runner
        if: runner.os == 'Linux'
        run: command -v gcc >/dev/null || { sudo apt-get update && sudo apt-get install -y build-essential; }

      # The antimatter-vps image has no Go in its tool cache: extracting it there
      # first spares setup-go a minute-long copy into the cache (issue #121).
      - name: Go in the tool cache for the gated runner
        if: runner.os == 'Linux'
        run: scripts/ci-go-toolcache.sh

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: install chore
        run: scripts/ci-install-chore.sh

      - name: chore deps:verify
        run: chore deps:verify

      - name: chore vet
        run: chore vet

      # The pinned rust-fs-core beside this checkout: `chore test:native` and
      # `chore test:scripts` both run rust-fs-core's tier.sh in place from it.
      - name: chore siblings
        run: chore siblings

      # BOTH platforms, because the guards are shell, where the platforms
      # differ: macOS runners ship bash 3.2. A guard that only ever ran on ubuntu would be a guard that
      # had never met half the machines this repository is developed on.
      - name: chore test:scripts
        run: chore test:scripts

      # Quiet: one verdict line naming tmp/logs/native.log, which is uploaded
      # below. A failure names that log, which is in the artifact.
      - name: chore test:native
        run: chore test:native

      # BOTH platforms, because the log is where the detail went. A tier that
      # breaches its output budget says how big it was and nothing about what
      # was in it, so the run that has to be diagnosed is exactly the one whose
      # log must be here — and the platform that prints more is the one that
      # was not uploading anything.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-ubuntu-latest
          path: |
            coverage.out
            tmp/logs/

  test-macos-gate:
    needs: changes
    if: needs.changes.outputs.code == 'true' && github.event_name != 'merge_group'
    runs-on: antimatter-vps-gate
    timeout-minutes: 1
    outputs: { runner: "${{ steps.pick.outputs.runner }}" }
    steps: [{ id: pick, run: runner-gate pick macos-arm64 }]

  test-macos:
    name: test (macos-latest)
    needs: [changes, test-macos-gate]
    if: needs.changes.outputs.code == 'true' && github.event_name != 'merge_group'
    runs-on: ${{ needs.test-macos-gate.outputs.runner }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # The antimatter-vps image is not GitHub's: cgo needs a C compiler.
      - name: C toolchain for the gated runner
        if: runner.os == 'Linux'
        run: command -v gcc >/dev/null || { sudo apt-get update && sudo apt-get install -y build-essential; }

      # The antimatter-vps image has no Go in its tool cache: extracting it there
      # first spares setup-go a minute-long copy into the cache (issue #121).
      - name: Go in the tool cache for the gated runner
        if: runner.os == 'Linux'
        run: scripts/ci-go-toolcache.sh

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: install chore
        run: scripts/ci-install-chore.sh

      - name: chore deps:verify
        run: chore deps:verify

      - name: chore vet
        run: chore vet

      # The pinned rust-fs-core beside this checkout: `chore test:native` and
      # `chore test:scripts` both run rust-fs-core's tier.sh in place from it.
      - name: chore siblings
        run: chore siblings

      # BOTH platforms, because the guards are shell, where the platforms
      # differ: macOS runners ship bash 3.2. A guard that only ever ran on ubuntu would be a guard that
      # had never met half the machines this repository is developed on.
      - name: chore test:scripts
        run: chore test:scripts

      # Quiet: one verdict line naming tmp/logs/native.log, which is uploaded
      # below. A failure names that log, which is in the artifact.
      - name: chore test:native
        run: chore test:native

      # BOTH platforms, because the log is where the detail went. A tier that
      # breaches its output budget says how big it was and nothing about what
      # was in it, so the run that has to be diagnosed is exactly the one whose
      # log must be here — and the platform that prints more is the one that
      # was not uploading anything.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-macos-latest
          path: |
            coverage.out
            tmp/logs/

  integration-gate:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: antimatter-vps-gate
    timeout-minutes: 1
    outputs: { runner: "${{ steps.pick.outputs.runner }}" }
    steps: [{ id: pick, run: runner-gate pick linux-x64 }]

  integration:
    name: integration (containerised)
    needs: [changes, integration-gate]
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ needs.integration-gate.outputs.runner }}
    timeout-minutes: 5
    env:
      # Every server starts at once: four at a time was three waves of image
      # builds and port waits inside a five-minute budget.
      SERVERS_UP_JOBS: 11
    steps:
      - uses: actions/checkout@v4

      # The cache lives in the checkout, under a dot-directory that Go's `./...`
      # skips and .gitignore hides: inside the workspace the antimatter-vps
      # runner's Docker bind mounts reach it, and as a relative `path:` it is the
      # same string on every runner kind. actions/cache versions a cache by its
      # literal path, so `${{ runner.temp }}` (/home/runner/work/_temp on
      # GitHub, /home/runner/_work/_temp on the vps) made each kind's caches
      # invisible to the other (issue #123). docker-suite.sh mounts these
      # directories, so they are exported as absolute paths.
      - name: Go cache locations
        run: |
          echo "GO_BUILD_CACHE=$GITHUB_WORKSPACE/.ci-cache/go-networkfs/build" >> "$GITHUB_ENV"
          echo "GO_MODULE_CACHE=$GITHUB_WORKSPACE/.ci-cache/go-networkfs/modules" >> "$GITHUB_ENV"

      # The compression method is part of the cache version too: without zstd
      # actions/cache falls back to gzip, and the antimatter-vps image has none,
      # so a vps run could never restore what a GitHub runner saved with zstd.
      - name: zstd for the cache
        if: runner.os == 'Linux'
        run: command -v zstd >/dev/null || { sudo apt-get update && sudo apt-get install -y zstd; }

      # Restored and saved by separate steps: a cold run that reaches its
      # runtime limit must still keep what it compiled, or the next run is
      # cold too and never fits. The key carries the run id so a later run
      # replaces an earlier, smaller cache instead of finding it immutable.
      - uses: actions/cache/restore@v4
        id: gocache
        with:
          path: .ci-cache/go-networkfs
          key: ${{ runner.os }}-${{ runner.arch }}-networkfs-integration-${{ hashFiles('go.mod', 'go.sum', '.github/docker/testrunner/Dockerfile') }}-${{ github.run_id }}
          # The bare prefix comes last: a changed hash restores the newest older
          # cache instead of compiling everything inside the job's time budget.
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-networkfs-integration-${{ hashFiles('go.mod', 'go.sum', '.github/docker/testrunner/Dockerfile') }}-
            ${{ runner.os }}-${{ runner.arch }}-networkfs-integration-

      # Everything runs inside containers: eleven servers for the drivers that
      # need one, and a runner carrying the Go toolchain, a C compiler and
      # chore. No toolchain is installed on this runner, so what CI executes is
      # what a contributor executes with `chore test`.
      #
      # The S3 server (stupid-simple-s3) is the one that also runs natively —
      # `chore test:s3` fetches its pinned binary and needs no daemon. It stays
      # a container here so it can join the shared network and be reached by
      # name, the same as the other five. Every image is pinned.
      - name: install chore
        run: scripts/ci-install-chore.sh

      # Bind-mounted into the container by scripts/docker-suite.sh at
      # /rust-fs-core, which is ../rust-fs-core from the checkout at /src.
      - name: chore siblings
        run: chore siblings

      - name: chore test
        run: chore test

      # Only a run that restored nothing, or only a cache of an older hash,
      # saves: the upload of a warm run's
      # 230MB took 2m32s of the five-minute budget and added nothing.
      - uses: actions/cache/save@v4
        if: always() && (steps.gocache.outputs.cache-matched-key == '' || !contains(steps.gocache.outputs.cache-matched-key, hashFiles('go.mod', 'go.sum', '.github/docker/testrunner/Dockerfile')))
        with:
          path: .ci-cache/go-networkfs
          key: ${{ runner.os }}-${{ runner.arch }}-networkfs-integration-${{ hashFiles('go.mod', 'go.sum', '.github/docker/testrunner/Dockerfile') }}-${{ github.run_id }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-coverage
          path: |
            coverage.out
            tmp/logs/

  lint-gate:
    runs-on: antimatter-vps-gate
    timeout-minutes: 1
    outputs: { runner: "${{ steps.pick.outputs.runner }}" }
    steps: [{ id: pick, run: runner-gate pick linux-x64 }]

  lint:
    name: lint
    needs: lint-gate
    runs-on: ${{ needs.lint-gate.outputs.runner }}
    # 8 for the same reason as `test`: 303s on the vps runner against 40s on
    # GitHub's, and the vps downloads golangci-lint on every job.
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      # The antimatter-vps image is not GitHub's: cgo needs a C compiler.
      - name: C toolchain for the gated runner
        if: runner.os == 'Linux'
        run: command -v gcc >/dev/null || { sudo apt-get update && sudo apt-get install -y build-essential; }

      # The antimatter-vps image has no Go in its tool cache: extracting it there
      # first spares setup-go a minute-long copy into the cache (issue #121).
      - name: Go in the tool cache for the gated runner
        if: runner.os == 'Linux'
        run: scripts/ci-go-toolcache.sh

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: install chore
        run: scripts/ci-install-chore.sh

      # The pinned golangci-lint, fetched as the release binary — the same one
      # golangci/golangci-lint-action used to install, now installed by a task
      # so `chore lint` locally is this job.
      - name: chore tools
        run: chore tools

      # `chore lint` runs rust-fs-core's ci-gate and family-check in place,
      # so it needs the pinned sibling like the tiers do.
      - name: chore siblings
        run: chore siblings

      # rust-fs-core's ci-gate reads YAML with PyYAML, which GitHub's image
      # carries and the antimatter-vps image may not.
      - name: PyYAML for the gate scripts
        run: python3 -c 'import yaml' 2>/dev/null || sudo apt-get install -y python3-yaml

      - name: chore lint
        run: chore lint

  vulncheck-gate:
    runs-on: antimatter-vps-gate
    timeout-minutes: 1
    outputs: { runner: "${{ steps.pick.outputs.runner }}" }
    steps: [{ id: pick, run: runner-gate pick linux-x64 }]

  vulncheck:
    name: govulncheck
    needs: vulncheck-gate
    runs-on: ${{ needs.vulncheck-gate.outputs.runner }}
    # 6: 219s on the vps runner, against 18-31s on GitHub's.
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      # The antimatter-vps image is not GitHub's: cgo needs a C compiler.
      - name: C toolchain for the gated runner
        if: runner.os == 'Linux'
        run: command -v gcc >/dev/null || { sudo apt-get update && sudo apt-get install -y build-essential; }

      # The antimatter-vps image has no Go in its tool cache: extracting it there
      # first spares setup-go a minute-long copy into the cache (issue #121).
      - name: Go in the tool cache for the gated runner
        if: runner.os == 'Linux'
        run: scripts/ci-go-toolcache.sh

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: install chore
        run: scripts/ci-install-chore.sh

      - name: chore tools
        run: chore tools

      # `chore vulncheck` runs rust-fs-core's agents-core check in place, so
      # it needs the pinned sibling like the tiers do.
      - name: chore siblings
        run: chore siblings

      # Not `govulncheck ./...` directly: the gate fails on anything this
      # project calls that has not been consciously accepted, and the accepted
      # list carries the reason each one is there. A check that is permanently
      # red because of one unfixable finding reports nothing at all.
      - name: chore vulncheck
        run: chore vulncheck

  archives-linux-gate:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: antimatter-vps-gate
    timeout-minutes: 1
    outputs: { runner: "${{ steps.pick.outputs.runner }}" }
    steps: [{ id: pick, run: runner-gate pick linux-x64 }]

  archives-linux:
    name: c-archive builds (ubuntu-latest)
    needs: [changes, archives-linux-gate]
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ needs.archives-linux-gate.outputs.runner }}
    # 6: 222s on the vps runner, against 30-58s on GitHub's.
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      # The antimatter-vps image is not GitHub's: cgo needs a C compiler.
      - name: C toolchain for the gated runner
        if: runner.os == 'Linux'
        run: command -v gcc >/dev/null || { sudo apt-get update && sudo apt-get install -y build-essential; }

      # The antimatter-vps image has no Go in its tool cache: extracting it there
      # first spares setup-go a minute-long copy into the cache (issue #121).
      - name: Go in the tool cache for the gated runner
        if: runner.os == 'Linux'
        run: scripts/ci-go-toolcache.sh

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: install chore
        run: scripts/ci-install-chore.sh

      # `archives:host`, not `archives`: the shipping task cross-builds for
      # darwin because its consumer is a macOS app, and what this job is for is
      # that the c-archive path still links on the machine it is running on.
      # One task, nine archives — the nine `go build` steps this replaced could
      # drift from the driver list and did not check it.
      - name: chore archives:host
        run: chore archives:host

      - name: chore tui
        run: chore tui

  archives-macos-gate:
    needs: changes
    if: needs.changes.outputs.code == 'true' && github.event_name != 'merge_group'
    runs-on: antimatter-vps-gate
    timeout-minutes: 1
    outputs: { runner: "${{ steps.pick.outputs.runner }}" }
    steps: [{ id: pick, run: runner-gate pick macos-arm64 }]

  archives-macos:
    name: c-archive builds (macos-latest)
    needs: [changes, archives-macos-gate]
    if: needs.changes.outputs.code == 'true' && github.event_name != 'merge_group'
    runs-on: ${{ needs.archives-macos-gate.outputs.runner }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # The antimatter-vps image is not GitHub's: cgo needs a C compiler.
      - name: C toolchain for the gated runner
        if: runner.os == 'Linux'
        run: command -v gcc >/dev/null || { sudo apt-get update && sudo apt-get install -y build-essential; }

      # The antimatter-vps image has no Go in its tool cache: extracting it there
      # first spares setup-go a minute-long copy into the cache (issue #121).
      - name: Go in the tool cache for the gated runner
        if: runner.os == 'Linux'
        run: scripts/ci-go-toolcache.sh

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: install chore
        run: scripts/ci-install-chore.sh

      # `archives:host`, not `archives`: the shipping task cross-builds for
      # darwin because its consumer is a macOS app, and what this job is for is
      # that the c-archive path still links on the machine it is running on.
      # One task, nine archives — the nine `go build` steps this replaced could
      # drift from the driver list and did not check it.
      - name: chore archives:host
        run: chore archives:host

      - name: chore tui
        run: chore tui

  # ci-ok runs `if: always()`, so its gate does too, and ci-ok falls back to
  # ubuntu-24.04 when the gate gave no answer: an empty runs-on never starts,
  # and the one required check would never report.
  ci-ok-gate:
    needs: [changes-gate, changes, test-linux-gate, test-linux, test-macos-gate, test-macos, integration-gate, integration, lint-gate, lint, vulncheck-gate, vulncheck, archives-linux-gate, archives-linux, archives-macos-gate, archives-macos]
    if: always()
    runs-on: antimatter-vps-gate
    timeout-minutes: 1
    outputs: { runner: "${{ steps.pick.outputs.runner }}" }
    steps: [{ id: pick, run: runner-gate pick linux-x64 }]

  ci-ok:
    name: ci-ok
    # THE ONE REQUIRED CHECK (#43). `.github-guard` named the seven check-runs
    # by hand, so a job added here gated nothing and a job renamed here left a
    # required check that never reports, which blocks every merge with nothing
    # red to point at. It runs no work of its own: it is a claim about the
    # other jobs, judged from `needs` as a whole, so a job added to `needs:`
    # is judged without editing this step.
    if: always()
    needs: [changes-gate, changes, test-linux-gate, test-linux, test-macos-gate, test-macos, integration-gate, integration, lint-gate, lint, vulncheck-gate, vulncheck, archives-linux-gate, archives-linux, archives-macos-gate, archives-macos, ci-ok-gate]
    runs-on: ${{ needs.ci-ok-gate.outputs.runner || 'ubuntu-24.04' }}
    timeout-minutes: 5
    # actions: read lists this run's jobs, so a failed gate can say which of
    # them never got a runner (#120).
    permissions:
      contents: read
      actions: read
    steps:
      - name: every gating job must have concluded success
        env:
          NEEDS: ${{ toJSON(needs) }}
          GH_TOKEN: ${{ github.token }}
          # false only for a change to documentation alone: then, and only
          # then, a skipped job is not a failed one.
          CODE: ${{ needs.changes.outputs.code }}
          # A merge group skips the macOS jobs and their gates (#120), and
          # that skip, there and nowhere else, is not a failed job either.
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "code changed: $CODE"
          bad="$(echo "$NEEDS" | jq -r --arg code "$CODE" --arg event "$EVENT" '
            ["test-macos-gate", "test-macos", "archives-macos-gate", "archives-macos"] as $macos
            | [to_entries[]
               | select(.value.result != "success")
               | select($code != "false" or .value.result != "skipped")
               | select($event != "merge_group" or .value.result != "skipped" or (.key as $k | $macos | index($k) | not))
               | .key] | join(", ")')"
          if [ -n "$bad" ]; then
            echo "::error::not 'success': $bad -- failure, cancellation and skipping all mean the gate did not run to completion"
            # Diagnostic only: a job that ran no step never had a runner, which
            # is not the change's fault. Nothing here may alter the verdict.
            if jobs="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs" --paginate 2>/dev/null)" &&
               report="$(echo "$jobs" | jq -rs '
                   [.[].jobs[] | select(.conclusion != null and .conclusion != "success" and .conclusion != "skipped")]
                   | (.[] | select((.steps | length) == 0 or (.runner_name // "") == "") | "never started (no runner assigned): \(.name) [\(.conclusion)]"),
                     (.[] | select((.steps | length) > 0 and (.runner_name // "") != "") | "failed: \(.name) [\(.conclusion)]")
               ' 2>/dev/null)"; then
              echo "$report"
            else
              echo "::warning::could not list this run's jobs; the verdict above stands"
            fi
            exit 1
          fi
          echo "all gating jobs succeeded"
